# Deadly Corridor for screen-only agents. The wrapper computes every reward
# (kills, damage, death, progress, vest) so the scenario's x-progress reward is
# never counted; HUD and damage flashes are on because a human player sees them.
doom_scenario_path = deadly_corridor.wad
doom_skill = 3
living_reward = 0
death_penalty = 0
screen_resolution = RES_160X120
screen_format = RGB24
render_hud = true
render_screen_flashes = true
episode_start_time = 1
episode_timeout = 2100
available_buttons =
    {
        MOVE_LEFT
        MOVE_RIGHT
        ATTACK
        MOVE_FORWARD
        TURN_LEFT
        TURN_RIGHT
    }
mode = PLAYER
