# E1M1 (Hangar) config for the Quantum agent
# WAD path, map and skill are set from e1m1_env.py

# Rewards are computed in e1m1_env.py
living_reward = 0
death_penalty = 0

# Rendering options
screen_resolution = RES_320X240
screen_format = RGB24
render_hud = false
render_crosshair = false
render_weapon = true
render_messages = false

episode_start_time = 1

# 3 minutes of game time (35 tics/s)
episode_timeout = 6300

# 7 buttons: identical to navigation env buttons
available_buttons =
    {
        MOVE_LEFT
        MOVE_RIGHT
        ATTACK
        MOVE_FORWARD
        TURN_LEFT
        TURN_RIGHT
        USE
    }

available_game_variables = { POSITION_X POSITION_Y ANGLE HEALTH KILLCOUNT AMMO2 }

mode = PLAYER
