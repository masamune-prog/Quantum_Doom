# My Way Home config for Quantum Navigation & Combat Agent
# 7 discrete actions matching Deadly Corridor + USE button

doom_scenario_path = my_way_home.wad
doom_skill = 5

# Rewards
living_reward = -0.0001

# Rendering options
screen_resolution = RES_320X240
screen_format = RGB24
render_hud = false
render_crosshair = false
render_weapon = true

# Make episodes start after 10 tics
episode_start_time = 10

# Make episodes finish after 2100 actions (tics)
episode_timeout = 2100

# 7 buttons: identical to corridor buttons + USE
available_buttons =
    {
        MOVE_LEFT
        MOVE_RIGHT
        ATTACK
        MOVE_FORWARD
        TURN_LEFT
        TURN_RIGHT
        USE
    }

# Game variables needed for spatial tracking
available_game_variables = { POSITION_X POSITION_Y ANGLE HEALTH }

mode = PLAYER
