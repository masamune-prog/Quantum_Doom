# Deadly Corridor config for Quantum RL agent
# Reduced to 5 meaningful composite actions compatible with 8-qubit PQC

doom_scenario_path = deadly_corridor.wad

# Skill 3 (medium difficulty) to give the quantum agent a chance to learn
doom_skill = 3

# Rewards
living_reward = -0.01
death_penalty = 100

# Rendering options
screen_resolution = RES_320X240
screen_format = RGB24
render_hud = false
render_screen_flashes = false

# Make episodes start in the first tic
episode_start_time = 1

# Make episodes finish after 2100 actions (tics)
episode_timeout = 2100

# We use 6 buttons (singular actions)
available_buttons =
    {
        MOVE_LEFT
        MOVE_RIGHT
        ATTACK
        MOVE_FORWARD
        TURN_LEFT
        TURN_RIGHT
    }

# Game variables that will be in the state
available_game_variables = { HEALTH KILLCOUNT POSITION_X }

mode = PLAYER

