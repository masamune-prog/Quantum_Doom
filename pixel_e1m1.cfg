# E1M1 (Hangar) for screen-only agents. WAD path, map and skill are set from
# pixel_e1m1_env.py. The wrapper computes every reward (route progress, kills,
# damage, death, exit); HUD and damage flashes are on because a human player sees them.
living_reward = 0
death_penalty = 0
screen_resolution = RES_160X120
screen_format = RGB24
render_hud = true
render_screen_flashes = true
render_crosshair = false
render_weapon = true
render_messages = false
episode_start_time = 1
# 3 minutes of game time (35 tics/s) = 1575 decisions
episode_timeout = 6300
available_buttons =
    {
        MOVE_LEFT
        MOVE_RIGHT
        ATTACK
        MOVE_FORWARD
        TURN_LEFT
        TURN_RIGHT
        USE
    }
mode = PLAYER
